[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resilient-mis"
version = "0.1.0"
description = "Offline research companion to a published resilient MIS design: envelope encryption, policy-checked reads, anomaly detection and verified recovery of a spending report."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Partha Chakraborty" }]
dependencies = [
  "cryptography==50.0.2",
  "scikit-learn>=1.3,<2",
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "matplotlib>=3.7,<4",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4"]

[project.scripts]
resilient-mis = "resilient_mis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
resilient_mis = ["data/invalid_snapshot/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: end-to-end trials that take several seconds"]

[tool.coverage.run]
source = ["resilient_mis"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B905", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/resilient_mis/cli.py" = ["E501"]
"src/resilient_mis/report.py" = ["E501"]
